name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-24
          components: rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo test --all-targets
      - run: cargo test --doc

  miri:
    name: List safety (${{ matrix.model }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - model: stacked
            flags: ''
          - model: tree
            flags: -Zmiri-tree-borrows
    env:
      MIRIFLAGS: ${{ matrix.flags }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-24
          components: miri, rust-src
      - run: cargo miri test --lib linked_list::tests -- --test-threads=1
      - run: cargo miri test --lib join_handle::tests::completion_wake -- --test-threads=1
