name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-24
          components: rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo test --all-targets
      - run: cargo test --doc
